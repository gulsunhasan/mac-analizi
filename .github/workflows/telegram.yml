name: Telegram günlük paylaşım

on:
  # Otomatik çalışma kapalı: günlük paylaşımı Mac'teki görev yapıyor (secret hatalı olduğu için burada hep hata veriyordu)
  workflow_dispatch:       # GitHub'da "Run workflow" ile elle de çalıştırılabilir
    inputs:
      deneme:
        description: "Deneme: kontrol et ama kanala mesaj gönderme"
        type: boolean
        default: true

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Günün maçlarını kanala gönder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          DENEME: ${{ github.event.inputs.deneme }}
        run: python telegram_paylas.py
