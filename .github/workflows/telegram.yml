name: Telegram günlük paylaşım

on:
  schedule:
    - cron: "0 7 * * *"   # her gün 07:00 UTC = 10:00 Türkiye saati
  workflow_dispatch:       # GitHub'da "Run workflow" ile elle de çalıştırılabilir

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Günün maçlarını kanala gönder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python telegram_paylas.py
